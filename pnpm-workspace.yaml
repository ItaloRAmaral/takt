packages:
  - 'libs/*'
  - 'apps/*'

minimumReleaseAge: 10080
# semver@6.3.2 (2026-11-02) is required by Babel through Nx: trustPolicy refuses
# 6.3.1 because it predates trusted publishing. 6.3.2 has npm provenance from
# npm/node-semver. Approved by the user on 2026-11-04; remove once it is 7 days old.
minimumReleaseAgeExclude:
  - 'semver@6.3.2'
  # Nx 24.0.3 (2026-10-30) pins undici 7.30.1, which fixes 6 high advisories in the
  # undici 7.29.0 pinned by Nx 24.0.2; every package has npm provenance from nrwl/nx.
  # Approved by the user on 2026-11-04; remove once it is 7 days old (2026-11-06).
  - 'nx@24.0.3'
  - '@nx/devkit@24.0.3'
  - '@nx/eslint@24.0.3'
  - '@nx/eslint-plugin@24.0.3'
  - '@nx/js@24.0.3'
  - '@nx/vitest@24.0.3'
  - '@nx/workspace@24.0.3'
  - '@nx/nx-darwin-arm64@24.0.3'
  - '@nx/nx-darwin-x64@24.0.3'
  - '@nx/nx-freebsd-x64@24.0.3'
  - '@nx/nx-linux-arm-gnueabihf@24.0.3'
  - '@nx/nx-linux-arm64-gnu@24.0.3'
  - '@nx/nx-linux-arm64-musl@24.0.3'
  - '@nx/nx-linux-x64-gnu@24.0.3'
  - '@nx/nx-linux-x64-musl@24.0.3'
  - '@nx/nx-win32-arm64-msvc@24.0.3'
  - '@nx/nx-win32-x64-msvc@24.0.3'
strictDepBuilds: true
# Both scripts were read on 2026-11-04 and are not needed: the native binaries come
# from optional dependencies. nx: only updates the Nx Cloud client, which Takt does
# not use. @swc/core: falls back to `npm install @swc/wasm`, bypassing this policy.
allowBuilds:
  nx: false
  '@swc/core': false
trustPolicy: no-downgrade
blockExoticSubdeps: true
engineStrict: true
saveExact: true
# typed-rest-client 2.3.1 (through @stryker-mutator/core 10.1.1) pins qs 6.15.1, with 4 moderate
# advisories; 6.16.1 fixes them. Approved by the user on 2026-11-04; remove once Stryker
# depends on typed-rest-client 3 (qs ^6.16.0).
overrides:
  qs: 6.16.1
