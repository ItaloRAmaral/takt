name: Math measurement

# Measures log, exp and the engine draws in Node and in Chromium, Firefox and
# WebKit on three systems, and fails if the sets that must be identical are not.
# Runs when engine code reaches main, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'libs/sim-engine/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/math-measurement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm nx run sim-engine:measure-math
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: math-measurement-${{ runner.os }}
          path: libs/sim-engine/test-output/math-measurement/*.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: math-measurement-*
          merge-multiple: true
          path: math-measurement
      - shell: bash
        run: >
          python3 -I libs/sim-engine/measurements/math/compare.py math-measurement
          --require-identical uniforms fdlibm. draws.
          | tee -a "$GITHUB_STEP_SUMMARY"
